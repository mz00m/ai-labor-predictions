name: Update Signals Data

on:
  schedule:
    - cron: '0 6 * * 1'  # Monday 6am UTC (before weekly digest)
  workflow_dispatch:
    inputs:
      skip_bls:
        description: 'Skip BLS fetch (useful if API key expired)'
        type: boolean
        default: false
      skip_github:
        description: 'Skip GitHub activity fetch'
        type: boolean
        default: false

jobs:
  fetch-signals:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/signals/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/signals/requirements.txt

      - name: Fetch PyPI stats
        run: python3 scripts/signals/fetch_pypistats.py

      - name: Fetch npm stats
        run: python3 scripts/signals/fetch_npm.py

      - name: Fetch BLS employment data
        if: inputs.skip_bls != true
        run: python3 scripts/signals/fetch_bls.py
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}

      - name: Fetch GitHub activity
        if: inputs.skip_github != true
        run: python3 scripts/signals/fetch_github.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch StackOverflow activity
        run: python3 scripts/signals/fetch_stackoverflow.py
        env:
          STACKOVERFLOW_KEY: ${{ secrets.STACKOVERFLOW_KEY }}

      - name: Fetch HuggingFace downloads
        run: python3 scripts/signals/fetch_huggingface.py

      - name: Calculate metrics
        run: python3 scripts/signals/calculate_metrics.py

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check for changes
        id: changes
        run: |
          git add src/data/signals/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git reset 2>/dev/null || true
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR with updated signals
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="signals/update-${DATE}"

          git checkout -b "$BRANCH"
          git add src/data/signals/
          git commit -m "chore: update signals data ${DATE} [automated]"
          git push -u origin "$BRANCH"

          gh pr create \
            --title "Update Signals Data: ${DATE}" \
            --body "$(cat <<'EOF'
          ## Automated Signals Update

          Updated data from:
          - **PyPI** — package download stats
          - **npm** — package download stats
          - **BLS** — employment series
          - **GitHub** — repo activity (stars, issues, commits)
          - **StackOverflow** — question volume
          - **HuggingFace** — model downloads
          - **Metrics** — recalculated AAI, growth rates, industry aggregates

          Auto-generated by the `update-signals` workflow.
          EOF
          )" \
            --draft \
            --assignee "${{ github.repository_owner }}" \
            --label "automated,signals"

      - name: Skip message
        if: steps.changes.outputs.has_changes == 'false'
        run: echo "No signals data changes — skipping PR creation."
